name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The ruleset guards the main branch, and a tag is not a branch: anything can be
  # tagged, including a commit that never passed a check, and a manual dispatch
  # can name any ref. Reaching main is what says a revision was checked.
  from-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse a revision that never reached main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_SHA is not on main; only what reached main may be released"; exit 1; }

  docker:
    needs: from-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      # A tagged image is known by its tag, and anything else by the commit it
      # was built from, in the short form the image itself is tagged with.
      - name: Stamp the build
        id: stamp
        run: |
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            BUILT_AT=${{ steps.stamp.outputs.at }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    needs: from-main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Build
        working-directory: docs
        run: bun install && bun run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The server, for anyone installing it without Docker. One file: the client is
  # compiled into it.
  binaries:
    needs: from-main
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: bun install --frozen-lockfile
      - name: Build client
        run: bun run build
      - name: Compile it into the server
        run: cp -r apps/client/dist apps/api/client/dist
      - name: Build
        working-directory: apps/api
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../../melody-api-linux-$arch" .
          done
      - name: Checksums
        run: sha256sum melody-api-linux-* > melody-api-checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-binaries
          path: |
            melody-api-linux-*
            melody-api-checksums.txt
          retention-days: 90

  cli:
    needs: from-main
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Build CLI binaries
        working-directory: apps/cli
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            suffix=""
            if [ "$GOOS" = windows ]; then suffix=".exe"; fi
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags='-s -w' -o "../../melody-cli-$GOOS-$GOARCH$suffix" .
          done
      - name: Checksums
        run: |
          sha256sum \
            melody-cli-linux-amd64 \
            melody-cli-linux-arm64 \
            melody-cli-darwin-amd64 \
            melody-cli-darwin-arm64 \
            melody-cli-windows-amd64.exe \
            melody-cli-windows-arm64.exe \
            > melody-cli-checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binaries
          path: |
            melody-cli-linux-amd64
            melody-cli-linux-arm64
            melody-cli-darwin-amd64
            melody-cli-darwin-arm64
            melody-cli-windows-amd64.exe
            melody-cli-windows-arm64.exe
            melody-cli-checksums.txt
          retention-days: 90

  desktop:
    needs: from-main
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            archive: tar.gz
            cgo: '1'
            ldflags: '-s -w'
            executable: melody-manager
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            cgo: '1'
            ldflags: '-s -w'
            executable: melody-manager
          - os: windows
            arch: amd64
            runner: windows-latest
            archive: zip
            cgo: '0'
            ldflags: '-s -w -H windowsgui'
            executable: melody-manager.exe
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            archive: zip
            cgo: '1'
            ldflags: '-s -w'
            executable: melody-manager
          - os: darwin
            arch: arm64
            runner: macos-latest
            archive: zip
            cgo: '1'
            ldflags: '-s -w'
            executable: melody-manager
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Install Wails system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: bun install --frozen-lockfile
      - name: Build desktop frontend
        run: bun run build:desktop
      - name: Build desktop client
        working-directory: apps/desktop
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p ../../package/bin
          go build -trimpath -ldflags='${{ matrix.ldflags }}' -o "../../package/bin/${{ matrix.executable }}" .
      - name: Package desktop client for Linux
        if: runner.os == 'Linux'
        run: |
          install -Dm644 apps/desktop/melody-manager.desktop package/share/applications/melody-manager.desktop
          install -Dm644 apps/client/public/pwa-512x512.png package/share/icons/hicolor/512x512/apps/melody-manager.png
          install -Dm644 apps/client/public/pwa-192x192.png package/share/icons/hicolor/192x192/apps/melody-manager.png
          tar -czf "melody-desktop-linux-${{ matrix.arch }}.tar.gz" -C package \
            bin/melody-manager \
            share/applications/melody-manager.desktop \
            share/icons/hicolor/512x512/apps/melody-manager.png \
            share/icons/hicolor/192x192/apps/melody-manager.png
          sha256sum "melody-desktop-linux-${{ matrix.arch }}.tar.gz" > "melody-desktop-linux-${{ matrix.arch }}.tar.gz.sha256"
      - name: Package desktop client for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "melody-desktop-windows-${{ matrix.arch }}.zip"
          Compress-Archive -LiteralPath "package/bin/melody-manager.exe" -DestinationPath $archive
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          $zip.Dispose()
          "$((Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower())  $archive" |
            Set-Content "$archive.sha256"
      - name: Package desktop client for macOS
        if: runner.os == 'macOS'
        run: |
          archive="melody-desktop-darwin-${{ matrix.arch }}.zip"
          tar -a -cf "$archive" -C package bin/melody-manager
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            melody-desktop-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}
            melody-desktop-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}.sha256
          retention-days: 90

  android:
    needs: from-main
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Not the action's default of "tools platform-tools": Google retired the
      # legacy tools package and sdkmanager exits 1 on it.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: bun install --frozen-lockfile
      - name: Build client
        run: bun run build
      - name: Generate icons and splash screens
        run: bun run cap:assets
      - name: Sync Capacitor
        run: bunx cap sync android
      # android/gradle.properties is not in the repository, so on a runner the
      # flag has to be put back before gradle reads it.
      - name: Ensure AndroidX is enabled
        working-directory: android
        run: grep -q 'android.useAndroidX=true' gradle.properties 2>/dev/null || echo 'android.useAndroidX=true' >> gradle.properties
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      # Both derived from the tag, because build.gradle cannot know it. Android
      # refuses an update whose versionCode has not gone up, so a fixed one means
      # the second release can never be installed over the first.
      - name: Build release APK and bundle
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          # Ten thousand a major, a hundred a minor: monotonic for as long as a
          # minor or a patch stays under a hundred, and readable when it is not.
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "Building $name as versionCode $code"
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -PappVersionCode="$code" -PappVersionName="$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

  release:
    needs: [binaries, cli, desktop, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-binaries
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: cli-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: desktop-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-release*
          path: android-artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            melody-api-linux-amd64
            melody-api-linux-arm64
            melody-api-checksums.txt
            cli-artifacts/melody-cli-linux-amd64
            cli-artifacts/melody-cli-linux-arm64
            cli-artifacts/melody-cli-darwin-amd64
            cli-artifacts/melody-cli-darwin-arm64
            cli-artifacts/melody-cli-windows-amd64.exe
            cli-artifacts/melody-cli-windows-arm64.exe
            cli-artifacts/melody-cli-checksums.txt
            desktop-artifacts/*
            android-artifacts/app-release.apk
            android-artifacts/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
