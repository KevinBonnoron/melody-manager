name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The ruleset guards the main branch, and a tag is not a branch: anything can be
  # tagged, including a commit that never passed a check, and a manual dispatch
  # can name any ref. Reaching main is what says a revision was checked.
  from-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Refuse a revision that never reached main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_SHA is not on main; only what reached main may be released"; exit 1; }

  docker:
    needs: from-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      # A tagged image is known by its tag, and anything else by the commit it
      # was built from, in the short form the image itself is tagged with.
      - name: Stamp the build
        id: stamp
        run: |
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            BUILT_AT=${{ steps.stamp.outputs.at }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    needs: from-main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Build
        working-directory: docs
        run: bun install && bun run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The server, for anyone installing it without Docker. One file: the client is
  # compiled into it.
  binaries:
    needs: from-main
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: bun install --frozen-lockfile
      - name: Build client
        run: bun run build
      - name: Compile it into the server
        run: cp -r dist api/client/dist
      - name: Build
        working-directory: api
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../melody-api-linux-$arch" .
          done
      - name: Checksums
        run: sha256sum melody-api-linux-* > melody-api-checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-binaries
          path: |
            melody-api-linux-*
            melody-api-checksums.txt
          retention-days: 90

  cli:
    needs: from-main
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build CLI binaries
        working-directory: cli
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags='-s -w' -o "../melody-cli-$GOOS-$GOARCH" .
          done
      - name: Checksums
        run: |
          sha256sum \
            melody-cli-linux-amd64 \
            melody-cli-linux-arm64 \
            melody-cli-darwin-amd64 \
            melody-cli-darwin-arm64 \
            > melody-cli-checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binaries
          path: |
            melody-cli-linux-amd64
            melody-cli-linux-arm64
            melody-cli-darwin-amd64
            melody-cli-darwin-arm64
            melody-cli-checksums.txt
          retention-days: 90

  desktop:
    needs: from-main
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Install Wails system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: bun install --frozen-lockfile
      - name: Build desktop frontend
        run: bun run build:desktop
      - name: Build desktop client
        working-directory: desktop
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p ../package/bin
          go build -trimpath -ldflags='-s -w' -o ../package/bin/melody-manager .
      - name: Package desktop client
        run: |
          install -Dm644 desktop/melody-manager.desktop package/share/applications/melody-manager.desktop
          install -Dm644 public/pwa-512x512.png package/share/icons/hicolor/512x512/apps/melody-manager.png
          install -Dm644 public/pwa-192x192.png package/share/icons/hicolor/192x192/apps/melody-manager.png
          tar -czf "melody-desktop-linux-${{ matrix.arch }}.tar.gz" -C package \
            bin/melody-manager \
            share/applications/melody-manager.desktop \
            share/icons/hicolor/512x512/apps/melody-manager.png \
            share/icons/hicolor/192x192/apps/melody-manager.png
          sha256sum "melody-desktop-linux-${{ matrix.arch }}.tar.gz" > "melody-desktop-linux-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            melody-desktop-linux-${{ matrix.arch }}.tar.gz
            melody-desktop-linux-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 90

  android:
    needs: [from-main, binaries, cli, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Write: this job also creates the GitHub release the builds are attached to.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Not the action's default of "tools platform-tools": Google retired the
      # legacy tools package and sdkmanager exits 1 on it.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: bun install --frozen-lockfile
      - name: Build client
        run: bun run build
      - name: Generate icons and splash screens
        run: bun run cap:assets
      - name: Sync Capacitor
        run: bunx cap sync android
      # android/gradle.properties is not in the repository, so on a runner the
      # flag has to be put back before gradle reads it.
      - name: Ensure AndroidX is enabled
        working-directory: android
        run: grep -q 'android.useAndroidX=true' gradle.properties 2>/dev/null || echo 'android.useAndroidX=true' >> gradle.properties
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      # Both derived from the tag, because build.gradle cannot know it. Android
      # refuses an update whose versionCode has not gone up, so a fixed one means
      # the second release can never be installed over the first.
      - name: Build release APK and bundle
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          # Ten thousand a major, a hundred a minor: monotonic for as long as a
          # minor or a patch stays under a hundred, and readable when it is not.
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "Building $name as versionCode $code"
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -PappVersionCode="$code" -PappVersionName="$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-binaries
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: cli-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux-amd64
          path: desktop-artifacts/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux-arm64
          path: desktop-artifacts/arm64
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            melody-api-linux-amd64
            melody-api-linux-arm64
            melody-api-checksums.txt
            cli-artifacts/melody-cli-linux-amd64
            cli-artifacts/melody-cli-linux-arm64
            cli-artifacts/melody-cli-darwin-amd64
            cli-artifacts/melody-cli-darwin-arm64
            cli-artifacts/melody-cli-checksums.txt
            desktop-artifacts/amd64/melody-desktop-linux-amd64.tar.gz
            desktop-artifacts/amd64/melody-desktop-linux-amd64.tar.gz.sha256
            desktop-artifacts/arm64/melody-desktop-linux-arm64.tar.gz
            desktop-artifacts/arm64/melody-desktop-linux-arm64.tar.gz.sha256
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
