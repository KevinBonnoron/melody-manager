name: Release

# Builds and publishes a release from its tag: the Docker image, the files
# attached to the GitHub release, and the docs. Nothing is published from main:
# `latest` is the latest release, and the site documents it. The code was checked
# by the CI of its pull requests, so nothing is tested again. release-please.yml
# starts it on the tag it creates; a tag pushed by hand starts it too, and a
# manual run on a tag rebuilds that release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# One run per tag, never cancelled: a half-published release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The ruleset guards the main branch, and a tag is not a branch: anything can be
  # tagged, including a commit that never passed a check. Reaching main is what
  # says a revision was checked. A tag pushed by hand gets its GitHub release here.
  target:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::start a release on its tag, not on $GITHUB_REF_NAME"
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_SHA is not on main; only what reached main may be released"; exit 1; }
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

  build:
    needs: target
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # The guide of the latest release. Whether this is the latest is asked just
  # before deploying, one deployment at a time: two releases built at once finish
  # in any order, and a rebuild of an older one must not take the site back.
  docs:
    needs: target
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Build
        working-directory: apps/website
        run: bun install && bun run build
      - name: Is it the latest release?
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "$GITHUB_REF_NAME is not the latest release ($latest): the site stays as it is."
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.latest.outputs.latest == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.latest.outputs.latest == 'true'
        with:
          path: apps/website/.vitepress/dist
      - id: deployment
        if: steps.latest.outputs.latest == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The release exists already, created by release-please or by `target`; this
  # attaches the files to it, leaving its notes as they are.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-binaries
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: cli-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: desktop-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-release*
          path: android-artifacts
          merge-multiple: true
      - name: Attach the artefacts to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            melody-api-linux-amd64
            melody-api-linux-arm64
            melody-api-checksums.txt
            cli-artifacts/melody-cli-linux-amd64
            cli-artifacts/melody-cli-linux-arm64
            cli-artifacts/melody-cli-darwin-amd64
            cli-artifacts/melody-cli-darwin-arm64
            cli-artifacts/melody-cli-windows-amd64.exe
            cli-artifacts/melody-cli-windows-arm64.exe
            cli-artifacts/melody-cli-checksums.txt
            desktop-artifacts/*
            android-artifacts/app-release.apk
            android-artifacts/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
