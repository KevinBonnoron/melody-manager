name: Build

# Everything a release ships, built one way for both callers: a pull request
# builds it all, unsigned and unpublished, to prove it still builds; release.yml,
# running on the tag, signs and publishes it. A build only a release runs breaks
# unseen until the tag, and by then release-please has made the release public.
on:
  workflow_call:
    inputs:
      release:
        description: Sign and publish, from the tag the caller runs on.
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: inputs.release
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only the exact version: the tags that float, X.Y, X and latest, are
          # moved once the image is pushed, by the last step. latest=false, or a
          # semver tag would bring latest along on its own.
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      # A released image is known by its tag, and a pull request's by the commit
      # it was built from.
      - name: Stamp the build
        id: stamp
        run: |
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      # Only a released image is built for arm64 too: the build stages
      # cross-compile, and what runs emulated is the apt install of the last one.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            BUILT_AT=${{ steps.stamp.outputs.at }}
          push: ${{ inputs.release }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.release && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=gha
          # Written by pull requests only: none can read a cache written on a tag.
          cache-to: ${{ !inputs.release && 'type=gha,mode=max' || '' }}
      # Asked again now, not when the run started: two releases built at once
      # finish in any order, and a rebuild of an older one must not take the
      # floating tags back. Before 1.0 a minor version may break, so there is
      # no bare X tag that would promise what 0.x does not.
      - name: Move the floating tags
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME is not the latest release ($latest): only its exact version is tagged."
            exit 0
          fi
          image="$REGISTRY/${IMAGE_NAME,,}"
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor _ <<< "$version"
          tags=(-t "$image:$major.$minor" -t "$image:latest")
          if [ "$major" != 0 ]; then tags+=(-t "$image:$major"); fi
          docker buildx imagetools create "${tags[@]}" "$image:$version"

  # The server, for anyone installing it without Docker. One file: the client is
  # compiled into it.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: bun install --frozen-lockfile
      - name: Build client
        run: bun run build
      - name: Compile it into the server
        run: cp -r apps/client/dist apps/server/client/dist
      - name: Build
        working-directory: apps/server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../../melody-api-linux-$arch" .
          done
      - name: Checksums
        run: sha256sum melody-api-linux-* > melody-api-checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-binaries
          path: |
            melody-api-linux-*
            melody-api-checksums.txt
          retention-days: ${{ inputs.release && 90 || 7 }}

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Build CLI binaries
        working-directory: apps/cli
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            suffix=""
            if [ "$GOOS" = windows ]; then suffix=".exe"; fi
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags='-s -w' -o "../../melody-cli-$GOOS-$GOARCH$suffix" .
          done
      - name: Checksums
        run: |
          sha256sum \
            melody-cli-linux-amd64 \
            melody-cli-linux-arm64 \
            melody-cli-darwin-amd64 \
            melody-cli-darwin-arm64 \
            melody-cli-windows-amd64.exe \
            melody-cli-windows-arm64.exe \
            > melody-cli-checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: |
            melody-cli-linux-amd64
            melody-cli-linux-arm64
            melody-cli-darwin-amd64
            melody-cli-darwin-arm64
            melody-cli-windows-amd64.exe
            melody-cli-windows-arm64.exe
            melody-cli-checksums.txt
          retention-days: ${{ inputs.release && 90 || 7 }}

  desktop:
    name: desktop (${{ matrix.os }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            archive: tar.gz
            cgo: '1'
            ldflags: '-s -w'
            executable: melody-manager
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            cgo: '1'
            ldflags: '-s -w'
            executable: melody-manager
          - os: windows
            arch: amd64
            runner: windows-latest
            archive: zip
            cgo: '0'
            ldflags: '-s -w -H windowsgui'
            executable: melody-manager.exe
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            archive: zip
            cgo: '1'
            ldflags: '-s -w'
            executable: melody-manager
          - os: darwin
            arch: arm64
            runner: macos-latest
            archive: zip
            cgo: '1'
            ldflags: '-s -w'
            executable: melody-manager
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Install Wails system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: bun install --frozen-lockfile
      - name: Build desktop frontend
        run: bun run build:desktop
      - name: Build desktop client
        working-directory: apps/desktop
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p ../../package/bin
          go build -trimpath -ldflags='${{ matrix.ldflags }}' -o "../../package/bin/${{ matrix.executable }}" .
      - name: Package desktop client for Linux
        if: runner.os == 'Linux'
        run: |
          install -Dm644 apps/desktop/melody-manager.desktop package/share/applications/melody-manager.desktop
          install -Dm644 apps/client/public/pwa-512x512.png package/share/icons/hicolor/512x512/apps/melody-manager.png
          install -Dm644 apps/client/public/pwa-192x192.png package/share/icons/hicolor/192x192/apps/melody-manager.png
          tar -czf "melody-desktop-linux-${{ matrix.arch }}.tar.gz" -C package \
            bin/melody-manager \
            share/applications/melody-manager.desktop \
            share/icons/hicolor/512x512/apps/melody-manager.png \
            share/icons/hicolor/192x192/apps/melody-manager.png
          sha256sum "melody-desktop-linux-${{ matrix.arch }}.tar.gz" > "melody-desktop-linux-${{ matrix.arch }}.tar.gz.sha256"
      - name: Package desktop client for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "melody-desktop-windows-${{ matrix.arch }}.zip"
          Compress-Archive -LiteralPath "package/bin/melody-manager.exe" -DestinationPath $archive
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          $zip.Dispose()
          "$((Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower())  $archive" |
            Set-Content "$archive.sha256"
      - name: Package desktop client for macOS
        if: runner.os == 'macOS'
        run: |
          archive="melody-desktop-darwin-${{ matrix.arch }}.zip"
          tar -a -cf "$archive" -C package bin/melody-manager
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            melody-desktop-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}
            melody-desktop-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}.sha256
          retention-days: ${{ inputs.release && 90 || 7 }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Not the action's default of "tools platform-tools": Google retired the
      # legacy tools package and sdkmanager exits 1 on it.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: bun install --frozen-lockfile
      - name: Build client
        run: bun run build
      - name: Generate icons and splash screens
        run: bun run cap:assets
      - name: Sync Capacitor
        working-directory: apps/client
        run: bunx cap sync android
      # apps/android/gradle.properties is not in the repository, so on a runner the
      # flag has to be put back before gradle reads it.
      - name: Ensure AndroidX is enabled
        working-directory: apps/android
        run: grep -q 'android.useAndroidX=true' gradle.properties 2>/dev/null || echo 'android.useAndroidX=true' >> gradle.properties
      - name: Decode keystore
        if: inputs.release
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/android/app/release.keystore
      # A release is signed, and both its versions are derived from the tag,
      # because build.gradle cannot know it. Android refuses an update whose
      # versionCode has not gone up, so a fixed one means the second release can
      # never be installed over the first. Anything else runs the same release
      # tasks unsigned, build.gradle signing only when given a keystore, plus a
      # debug APK, which installs.
      - name: Build release APK and bundle
        working-directory: apps/android
        env:
          KEYSTORE_FILE: ${{ inputs.release && 'release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE: ${{ inputs.release }}
        run: |
          chmod +x ./gradlew
          if [ "$RELEASE" != true ]; then
            ./gradlew assembleRelease bundleRelease assembleDebug
            exit
          fi
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          # Ten thousand a major, a hundred a minor: monotonic for as long as a
          # minor or a patch stays under a hundred, and readable when it is not.
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "Building $name as versionCode $code"
          ./gradlew assembleRelease bundleRelease -PappVersionCode="$code" -PappVersionName="$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release
        with:
          name: app-release
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release
        with:
          name: app-release-bundle
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.release }}
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
