name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome check .
      - name: Type-check
        run: bun run type-check
      - name: Test
        run: bun test src

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CGO_ENABLED: '0' # PocketBase uses pure-Go modernc.org/sqlite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      # Both Go trees, from the root: the desktop client is its own module and
      # nothing was checking it.
      - name: Formatting
        working-directory: .
        run: test -z "$(gofmt -l api desktop)" || { gofmt -l api desktop; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test
        run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.artifacts
          retention-days: 7

  # A second install path nobody runs is decoration. This one is run on every
  # change, in both shapes it can write.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax
        run: bash -n install.sh
      - name: Shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck && shellcheck install.sh
      - name: On a network of its own
        run: |
          mkdir -p /tmp/music /tmp/bridge
          ./install.sh --dir /tmp/bridge --music /tmp/music --discovery no --port 9000 --public-url http://192.168.1.20:9000
          docker compose -f /tmp/bridge/docker-compose.yml config -q
          python3 -c "import json; json.load(open('/tmp/bridge/config/config.json'))"
          grep -q '"9000:8090"' /tmp/bridge/docker-compose.yml
      # A directory is allowed to hold a quote and a dollar. Written as they came,
      # the first makes a compose file docker cannot read and the second is read
      # by compose itself, which mounts a directory nobody named.
      - name: On a path it has to spell out
        run: |
          mkdir -p '/tmp/a"b$HOME' /tmp/quoted
          touch '/tmp/a"b$HOME/marker'
          ./install.sh --dir /tmp/quoted --music '/tmp/a"b$HOME' --discovery no --port 9000 --public-url 'http://192.168.1.20:9000/"x'
          docker compose -f /tmp/quoted/docker-compose.yml config -q
          python3 -c "import json; json.load(open('/tmp/quoted/config/config.json'))"
          # That the file parses is not the question. Where the mount lands is,
          # and only something that mounts it can answer.
          printf 'services:\n  probe:\n    image: busybox\n    command: ls /music\n    volumes:\n' > /tmp/quoted/probe.yml
          grep ':/music:ro' /tmp/quoted/docker-compose.yml >> /tmp/quoted/probe.yml
          docker compose -f /tmp/quoted/probe.yml run --rm probe | grep -q marker

      # A speaker is the only reason the address has to be a real one. Without
      # one, localhost is exactly right, and refusing it would be refusing the
      # ordinary install.
      - name: In a browser alone, where localhost is the right answer
        run: |
          mkdir -p /tmp/browser
          ./install.sh --dir /tmp/browser --music /tmp/music --discovery no --port 9000 --public-url http://localhost:9000
          python3 -c "import json; assert json.load(open('/tmp/browser/config/config.json'))['publicUrl'] == 'http://localhost:9000'"

      # Without ip(8) the address comes from hostname -I, and an IPv6 one is not
      # a URL until it is bracketed.
      - name: On a host that answers with IPv6
        run: |
          mkdir -p /tmp/stub /tmp/v6
          printf '#!/bin/sh\nexit 1\n' > /tmp/stub/ip
          printf '#!/bin/sh\necho 2001:db8::1\n' > /tmp/stub/hostname
          chmod +x /tmp/stub/ip /tmp/stub/hostname
          PATH=/tmp/stub:$PATH ./install.sh --dir /tmp/v6 --music /tmp/music --discovery no --port 9000
          python3 -c "import json; assert json.load(open('/tmp/v6/config/config.json'))['publicUrl'] == 'http://[2001:db8::1]:9000'"

      - name: On the host network, where speakers are found
        run: |
          mkdir -p /tmp/host
          ./install.sh --dir /tmp/host --music /tmp/music --discovery yes --public-url http://192.168.1.20:8090
          docker compose -f /tmp/host/docker-compose.yml config -q
          grep -q 'network_mode: host' /tmp/host/docker-compose.yml
          ! grep -q 'ports:' /tmp/host/docker-compose.yml
      # Written out rather than with a leading "!", for which set -e is ignored:
      # the step passed whether the installer refused or not.
      - name: It refuses rather than guesses
        run: |
          refuses() {
            if ./install.sh "$@" >/dev/null 2>&1; then
              echo "install.sh accepted what it should have refused: $*" >&2
              exit 1
            fi
          }
          mkdir -p "$(printf '/tmp/new\nline')"
          refuses --dir /tmp/bridge --music /tmp/does-not-exist --discovery no
          refuses --dir /tmp/bridge --music /tmp/music --discovery no --public-url ftp://nope
          refuses --dir /tmp/bridge --music /tmp/music --discovery no --public-url http://
          refuses --dir /tmp/bridge --music /tmp/music --discovery no --public-url 'http://?query'
          refuses --dir /tmp/bridge --music /tmp/music --discovery no --public-url 'http://#fragment'
          refuses --dir /tmp/bridge --music /tmp/music --discovery no --port 70000 --public-url http://192.168.1.20:8090
          refuses --dir /tmp/bridge --music /tmp/music --discovery no --port 999999999999999999999999 --public-url http://192.168.1.20:8090
          refuses --dir /tmp/bridge --music "$(printf '/tmp/new\nline')" --discovery no --public-url http://192.168.1.20:8090
          refuses --dir "$(printf '/tmp/new\nline')" --music /tmp/music --discovery no --public-url http://192.168.1.20:8090
          refuses --dir /tmp/bridge --music /tmp/music --discovery yes --public-url http://localhost:8090
          refuses --dir /tmp/bridge --music /tmp/music --discovery yes --public-url 'http://[::1]:8090'
          refuses --dir /tmp/bridge --music /tmp/music --discovery yes --public-url 'http://[::ffff:127.0.0.1]:8090'
          refuses --dir /tmp/bridge --music /tmp/music --discovery yes --public-url 'http://[::FFFF:7f00:1]:8090'
          refuses --dir /tmp/bridge --music /tmp/music --discovery no

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Build
        working-directory: docs
        run: bun install && bun run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Not the action's default of "tools platform-tools": Google retired the
      # legacy tools package and sdkmanager exits 1 on it.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: bun install --frozen-lockfile
      - name: Build client
        run: bun run build
      - name: Generate icons and splash screens
        run: bun run cap:assets
      - name: Sync Capacitor
        run: bunx cap sync android
      # android/gradle.properties is not in the repository, so on a runner the
      # flag has to be put back before gradle reads it.
      - name: Ensure AndroidX is enabled
        working-directory: android
        run: grep -q 'android.useAndroidX=true' gradle.properties 2>/dev/null || echo 'android.useAndroidX=true' >> gradle.properties
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -Pandroid.useAndroidX=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  docker:
    needs: [client, api, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
