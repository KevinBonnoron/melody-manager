name: CI

# Everything that checks, and nothing that publishes. What makes these binding is
# the branch ruleset: a pull request cannot merge unless it is up to date with
# main and every one of these has passed, so what lands is what was tested here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome check .
      - name: Type-check
        run: bun run type-check
      - name: Test
        run: bun test src

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CGO_ENABLED: '0' # PocketBase uses pure-Go modernc.org/sqlite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # The suite drives the real binary serving the real bundle, so it needs both
  # toolchains and a browser.
  e2e:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test
        run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.artifacts
          retention-days: 7

  # Not filtered on docs/**: the build is fifteen seconds, and a dead link can be
  # introduced by a page that moves as easily as by the page that points at it.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Build
        working-directory: docs
        run: bun install && bun run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: bun install --frozen-lockfile
      - name: Build client
        run: bun run build
      - name: Generate icons and splash screens
        run: bun run cap:assets
      - name: Sync Capacitor
        run: bunx cap sync android
      # android/gradle.properties is not in the repository, so on a runner the
      # flag has to be put back before gradle reads it.
      - name: Ensure AndroidX is enabled
        working-directory: android
        run: grep -q 'android.useAndroidX=true' gradle.properties 2>/dev/null || echo 'android.useAndroidX=true' >> gradle.properties
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -Pandroid.useAndroidX=true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # One architecture here, because this is asking whether the image still builds.
  # The release workflow is where it is built for both and pushed.
  docker:
    needs: [client, api, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
