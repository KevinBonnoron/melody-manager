version: 2

# Minor and patch releases come grouped, one pull request per ecosystem a week,
# and merge themselves once green (see workflows/dependabot.yml); a major one
# comes on its own and waits for review, since it is the kind that breaks.
#
# Each ecosystem has its own day. The ruleset only merges a branch that is up to
# date with main, and Dependabot rebases only on a conflict: two pull requests
# opened together would leave the second one behind main for good once the first
# merged. A day apart, each has merged before the next arrives.
#
# A version is proposed only once it is a week old: a release that turns out to
# be broken or compromised is usually pulled within days. Security updates are
# not delayed.
updates:
  # The workflows pin every action to a commit, which is the point: a tag can be
  # moved, a commit cannot. The cost is that a pin never moves on its own, so
  # this is what keeps them current, checked like any other change.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/server
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      go-server:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/cli
    schedule:
      interval: weekly
      day: wednesday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      go-cli:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      go-desktop:
        patterns: ['*']
        update-types: [minor, patch]

  # The root lockfile covers the client workspace; the website keeps its own.
  - package-ecosystem: bun
    directories: [/, /apps/website]
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      bun:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: saturday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: sunday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns: ['*']
        update-types: [minor, patch]
