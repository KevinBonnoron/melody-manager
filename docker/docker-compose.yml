services:
  melody-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # The name it is published under, so that an image built here goes where a
    # pulled one would rather than beside it under a second name. Naming a
    # published image is also asking for it, so this file says to build the
    # checkout it sits in instead, which is what it is for.
    image: ghcr.io/kevinbonnoron/melody-manager:latest
    pull_policy: build
    container_name: melody-manager
    ports:
      - "8090:8090"
    volumes:
      # Persist PocketBase data (DB, uploaded covers, etc.)
      - melody-manager-data:/app/pb_data
      # Operator configuration, editable from the host while the server is down
      - ./config:/config

      # Cached audio from remote sources, so a track is fetched once
      - melody-manager-cache:/app/cache

      # Mount your audio files here and point the local provider at it
      # - /path/to/your/music:/music:ro
    environment:
      # Operator settings live in ./config/config.json, written with the
      # defaults on first run and edited there or from the admin screen.
      - CONFIG_FILE=/config/config.json
      # Optional: bootstrap a PocketBase superuser on first run
      # - PB_SUPERUSER_EMAIL=admin@example.com
      # - PB_SUPERUSER_PASSWORD=change-me
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  melody-manager-data:
    driver: local
  melody-manager-cache:
    driver: local
