services:
  melody-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: melody-manager:latest
    container_name: melody-manager
    ports:
      - "8090:8090"
    volumes:
      # Persist PocketBase data (DB, uploaded covers, etc.)
      - melody-manager-data:/app/pb_data

      # Cached audio from remote sources, so a track is fetched once
      - melody-manager-cache:/app/cache

      # Mount your audio files here and point the local provider at it
      # - /path/to/your/music:/music:ro
    environment:
      # Public URL of this server (used to build stream URLs for Sonos devices)
      - SERVER_URL=http://localhost:8090
      - CACHE_DIR=/app/cache
      - CACHE_MAX_FILES=500
      - CACHE_MAX_SIZE=5GB
      # Optional: bootstrap a PocketBase superuser on first run
      # - PB_SUPERUSER_EMAIL=admin@example.com
      # - PB_SUPERUSER_PASSWORD=change-me
      # Optional: disable public registration (first user can always register)
      # - REGISTRATION_DISABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  melody-manager-data:
    driver: local
  melody-manager-cache:
    driver: local
