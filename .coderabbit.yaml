# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
reviews:
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  path_filters:
    - '!bun.lock'
    - '!flake.lock'
    - '!apps/server/go.sum'
    - '!apps/client/src/routeTree.gen.ts'
    - '!apps/server/internal/migrations/snapshot.json'
    - '!apps/client/src/i18n/locales/**'
    - '!apps/client/public/*.png'
    - '!apps/android/app/src/main/res/**'
    - '!apps/android/gradlew*'
    - '!apps/android/gradle/wrapper/**'
    - '!apps/android/**/capacitor*.gradle'
    - '!apps/ios/App/App.xcodeproj/**'
    - '!apps/ios/App/CapApp-SPM/**'
  auto_review:
    # Default is a pause after five reviewed commits, which a branch reaches
    # before it is ready and every push after that has to be asked for by hand.
    auto_pause_after_reviewed_commits: 0
  # Run by the CI, which gates the merge; a second opinion on the same files
  # costs a run and says the same thing.
  tools:
    biome:
      enabled: false
    golangci-lint:
      enabled: false
    # Not this project's linter, and it reports against its own defaults.
    eslint:
      enabled: false
    oxc:
      enabled: false
