pre-commit:
  jobs:
    - name: biome format
      glob: "*.{js,ts,jsx,tsx,css}"
      # Without this, a commit touching only files biome's config excludes, a
      # stylesheet for one, is refused: biome reports being given nothing to do.
      run: bunx biome format --no-errors-on-unmatched --write {staged_files} && git add {staged_files}

pre-push:
  jobs:
    - name: test
      run: task test
